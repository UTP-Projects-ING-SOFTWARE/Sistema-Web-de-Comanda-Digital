# Servidor
server.port=8080

# Base de datos PostgreSQL (override via env)
spring.datasource.url=jdbc:postgresql://localhost:5433/swcd_db
spring.datasource.username=swcd_user
spring.datasource.password=swcd_pass
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Bootstrap del administrador (override via env)
bootstrap.admin.codigo=${ADMIN_CODIGO:admin}
bootstrap.admin.contrasena=${ADMIN_CONTRASENA:admin123}
bootstrap.admin.dni=${ADMIN_DNI:00000000}
bootstrap.admin.nombre=${ADMIN_NOMBRE:Admin}
bootstrap.admin.apellido=${ADMIN_APELLIDO:Principal}

# Logs
logging.level.root=INFO
logging.level.com.restobar=DEBUG
logging.level.org.springframework.security=INFO

# Desactivar caché de recursos estáticos para desarrollo
spring.web.resources.cache.period=0

# Desactivar caché de recursos estáticos para desarrollo
spring.web.resources.cache.period=0

# Desactivar persistencia de sesiones para evitar conflictos al reiniciar
server.servlet.session.persistent=false
